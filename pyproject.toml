[project]
name = "sentinellog-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KDhyanaSamaga", email = "kdhyanasamaga@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "passlib[argon2]>=1.7.4",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
sentinellog-ai = "sentinellog_ai:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
